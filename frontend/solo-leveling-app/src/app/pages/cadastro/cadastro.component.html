<div class="cadastro-page">
  <div class="hero">
    <h1 class="logo">SOLO LEVELING</h1>
    <p class="sub">Selecione seu perfil ou crie um novo</p>
  </div>

  <!-- Perfis existentes -->
  <div class="perfis-grid" *ngIf="perfis.length > 0">
    <button class="perfil-card" *ngFor="let p of perfis" (click)="selecionar(p)">
      <div class="avatar">
        <img *ngIf="fotoUrl(p)" [src]="fotoUrl(p)" alt="avatar" />
        <span *ngIf="!fotoUrl(p)" class="avatar-inicial">{{ p.nome[0] }}</span>
      </div>
      <span class="perfil-nome">{{ p.nome }}</span>
      <span class="perfil-rank">{{ p.rank }} · Nv {{ p.nivel }}</span>
    </button>
  </div>

  <p class="empty" *ngIf="perfis.length === 0">Nenhum perfil encontrado. Crie um abaixo.</p>

  <!-- Criar novo -->
  <div class="novo-card">
    <h2 class="novo-titulo">Novo Perfil</h2>
    <div class="input-row">
      <input
        type="text"
        [(ngModel)]="novoNome"
        placeholder="Digite seu nome..."
        (keyup.enter)="criar()"
        maxlength="30"
      />
      <button class="btn-criar" (click)="criar()">Criar</button>
    </div>
    <p class="erro" *ngIf="erro">{{ erro }}</p>
  </div>
</div>
