<button class="sino-btn" [class.aberto]="aberto" (click)="toggle()" [attr.aria-label]="'notificacoes.titulo' | translate">
  <span class="sino-icon-wrap">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="sino-badge" *ngIf="naoLidas > 0">{{ naoLidas > 9 ? '9+' : naoLidas }}</span>
  </span>
  <span class="sino-label">{{ 'notificacoes.titulo' | translate }}</span>
</button>

<div class="sino-overlay" *ngIf="aberto" (click)="fechar()"></div>

<div class="sino-painel" *ngIf="aberto">
  <div class="painel-head">
    <span class="painel-titulo">{{ 'notificacoes.titulo' | translate }}</span>
    <button class="painel-marcar" *ngIf="naoLidas > 0" (click)="marcarTodas()">
      {{ 'notificacoes.marcarTodas' | translate }}
    </button>
  </div>

  <div class="painel-vazio" *ngIf="notificacoes.length === 0">
    <app-icon name="sino" [size]="32"></app-icon>
    <p>{{ 'notificacoes.vazio' | translate }}</p>
  </div>

  <ul class="painel-lista" *ngIf="notificacoes.length > 0">
    <li class="noti" *ngFor="let n of notificacoes" [class.nao-lida]="!n.lida" (click)="marcarLida(n)">
      <span class="noti-emoji"><app-icon [name]="iconTipo(n.tipo)" [size]="20"></app-icon></span>
      <div class="noti-corpo">
        <p class="noti-msg">{{ n.mensagem }}</p>
        <span class="noti-quando">{{ quando(n.criadaEm) }}</span>
      </div>
      <span class="noti-dot" *ngIf="!n.lida"></span>
    </li>
  </ul>
</div>
